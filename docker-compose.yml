services:
  decoy:
    build: .
    image: decoy-http:latest
    container_name: decoy-http
    restart: unless-stopped
    # Never root. Runs as the host user that owns ./logs (1000 = first user
    # on a fresh Ubuntu VM), so the bind-mounted log folder is writable.
    user: "${DECOY_UID:-1000}:${DECOY_GID:-1000}"
    ports:
      - "80:8080"
    environment:
      DECOY_HOST: "0.0.0.0"
      DECOY_PORT: "8080"
      DECOY_LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs  # the only writable path
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128  # threads count as pids: MAX_CONNECTIONS (64) + headroom
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
